<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan">
<meta name="theme-color" content="#101419">
<meta name="description" content="Plan treningowy pod hipertrofię w 40 minut. Bez liczenia kalorii.">
<title>Plan</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#101419;
  --surface:#191E25;
  --surface2:#212730;
  --line:#2B333D;
  --txt:#EDF0F3;
  --mut:#8A94A0;
  --iron:#FFB020;
  --myo:#47B4C6;
  --ok:#5FD08A;
  --bad:#E8695B;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
body.hastimer{padding-bottom:calc(168px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
header{
  position:sticky;top:0;z-index:20;background:rgba(16,20,25,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);
}
header h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em}
header .sub{color:var(--mut);font-size:13px;margin-top:1px}
main{padding:16px 16px 0}
h2{font-size:15px;font-weight:600;color:var(--mut);margin:26px 0 10px}
h2:first-child{margin-top:4px}
h3{font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--surface2)}
.card.alert{border-color:var(--iron);background:rgba(255,176,32,.06)}
.card.back{border-color:var(--myo);background:rgba(71,180,198,.05)}
.flipout{animation:flipout .15s ease-in forwards}
.flipin{animation:flipin .24s ease-out}
@keyframes flipout{from{transform:perspective(900px) rotateY(0)}to{transform:perspective(900px) rotateY(88deg)}}
@keyframes flipin{from{transform:perspective(900px) rotateY(-88deg)}to{transform:perspective(900px) rotateY(0)}}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.big{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.mut{color:var(--mut)}
.s13{font-size:13px}
.s12{font-size:12px}
.empty{color:var(--mut);font-size:13.5px;line-height:1.55}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--surface2);border:1px solid var(--line);border-radius:11px;
  padding:11px 14px;font-size:15px;font-weight:600;min-height:46px;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--iron);border-color:var(--iron);color:#17140C}
.btn.aqua{background:var(--myo);border-color:var(--myo);color:#08181B}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:8px 11px;font-size:14px;border-radius:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input,select,textarea{
  font:inherit;font-size:16px;background:var(--surface2);color:var(--txt);
  border:1px solid var(--line);border-radius:10px;padding:11px;width:100%;
  font-variant-numeric:tabular-nums;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--iron);outline-offset:1px}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat}
label.f{display:block;font-size:13px;color:var(--mut);margin:0 0 5px}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(16,20,25,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
nav button{padding:9px 2px 8px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--iron)}
/* lista dni */
.daycard{display:flex;align-items:center;gap:13px}
.daycard.opt{border-style:dashed}
.daycard.opt .daytag{background:transparent;border:1px dashed var(--line)}
.daytag{width:54px;height:54px;flex:0 0 54px;border-radius:13px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.daytag b{font-size:16px;font-weight:700}
.daytag span{font-size:10px;color:var(--mut);margin-top:3px}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.exname{font-weight:600;font-size:16px;letter-spacing:-.01em}
.exmeta{color:var(--mut);font-size:12.5px;margin-top:2px}
.setrow{display:grid;grid-template-columns:58px 1fr 1fr 48px;gap:7px;align-items:center;margin-bottom:7px}
.setrow .n{color:var(--mut);font-size:11.5px;text-align:center;line-height:1.15}
.setrow .n b{display:block;font-size:13px;color:var(--txt);font-weight:600}
.setrow input{padding:10px 8px;text-align:center}
.check{height:44px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.check svg{width:19px;height:19px;stroke:var(--mut);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.setrow.done .check{background:var(--iron);border-color:var(--iron)}
.setrow.done .check svg{stroke:#17140C}
.setrow.fail .check{background:var(--bad);border-color:var(--bad)}
.setrow.fail .check svg{stroke:#1B0D0B}
.setrow.done input,.setrow.fail input{color:var(--mut)}
.hint{font-size:12.5px;color:var(--mut);margin-top:8px;padding-top:8px;border-top:1px solid var(--line);line-height:1.55}
.up{color:var(--ok);font-weight:600}
.down{color:var(--bad);font-weight:600}
.chg{display:grid;grid-template-columns:1fr 138px;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.chg:last-of-type{border-bottom:0}
.chg .nm{font-size:14.5px;font-weight:500}
.chg .rz{font-size:12px;color:var(--mut);margin-top:2px}
.chg input{text-align:center;padding:9px 6px;min-width:0}
.chg .btn.sm{padding:8px 0;min-width:32px;flex:0 0 32px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums;white-space:nowrap}
/* grupy: superseria i myo */
.grp{border:1px solid var(--iron);border-radius:16px;padding:8px;margin-bottom:14px;background:rgba(255,176,32,.04)}
.grp.myo{border-color:var(--myo);background:rgba(71,180,198,.05)}
.grp.plain{border-color:var(--line);background:transparent}
.grphead .mode{font-size:11.5px;font-weight:700;color:var(--iron);letter-spacing:.02em;text-transform:lowercase;margin-top:2px}
.grp.myo .grphead .mode{color:var(--myo)}
.grp.plain .grphead .mode{color:var(--mut)}
.grp .card{margin-bottom:8px}
.grp .card:last-child{margin-bottom:0}
.grphead{padding:7px 8px 10px}
.grphead b{font-size:13px;color:var(--iron);letter-spacing:.02em}
.grp.myo .grphead b{color:var(--myo)}
.grp.plain .grphead b{color:var(--txt)}
.grphead span{display:block;font-size:12.5px;color:var(--mut);margin-top:3px;line-height:1.5}
/* zegar sesji */
.clock{display:flex;align-items:baseline;gap:8px;justify-content:center;padding:10px;margin-bottom:14px;border:1px solid var(--line);border-radius:14px}
.clock span:first-child{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.clock.over{border-color:var(--bad)}
.clock.over span:first-child{color:var(--bad)}
/* timer przerwy */
.timer{
  position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:29;
  background:var(--iron);color:#17140C;border-radius:13px;padding:11px 14px;
  display:flex;align-items:center;gap:12px;box-shadow:0 8px 26px rgba(0,0,0,.45);
}
.timer.myo{background:var(--myo);color:#08181B}
.timer .t{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:74px}
.timer .lab{flex:1;font-size:12.5px;font-weight:600;line-height:1.3;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.timer button{background:rgba(0,0,0,.14);border-radius:9px;padding:8px 10px;font-size:13px;font-weight:700}
/* listy */
.list .it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .nm{font-size:14.5px}
.list .it .dt{font-size:12px;color:var(--mut);margin-top:2px}
.list .it .kc{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13.5px;white-space:nowrap}
.it.ok .nm{color:var(--mut);text-decoration:line-through}
.tickbox{width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:center}
.tickbox svg{width:15px;height:15px;stroke:var(--mut);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tickbox.on{background:var(--iron);border-color:var(--iron)}
.tickbox.on svg{stroke:#17140C}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-right:9px}
.cal{display:flex;gap:2px;width:100%}
.calcol{display:flex;flex-direction:column;gap:2px;flex:1 1 0;min-width:0}
.cal i{display:block;width:100%;aspect-ratio:1;border-radius:1.5px;background:var(--surface2)}
.cal i.on.upper{background:var(--iron)}
.cal i.on.lower{background:#5B8DEF}
.cal i.on.extra{background:var(--myo)}
.cal i.on.str{background:#4a5560}
.cal i.today{box-shadow:0 0 0 1.5px var(--txt)}
.cal i.future{opacity:.35}
.monrow{display:flex;gap:2px;width:100%;margin-bottom:5px}
.monrow span{flex:1 1 0;min-width:0;font-size:8.5px;color:var(--mut);white-space:nowrap}
.callegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mut)}
.callegend span{display:flex;align-items:center;gap:5px}
.callegend i{width:9px;height:9px;border-radius:2px;display:block;background:var(--surface2)}
.callegend i.upper{background:var(--iron)}
.callegend i.lower{background:#5B8DEF}
.callegend i.extra{background:var(--myo)}
.callegend i.str{background:#4a5560}
/* zwijane */
.fold .foldhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fold .chev svg{width:19px;height:19px;stroke:var(--mut);fill:none;stroke-width:2;transition:transform .15s}
.fold.open .chev svg{transform:rotate(180deg)}
.foldbody{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
/* wykres */
svg.spark{width:100%;height:130px;display:block}
/* arkusz */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sheet .in{background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-height:88vh;overflow:auto;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom));background:var(--surface2);border:1px solid var(--line);padding:11px 16px;border-radius:11px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--mut);border:1px solid var(--line)}
.pill.iron{color:var(--iron);border-color:rgba(255,176,32,.45)}
.pill.myo{color:var(--myo);border-color:rgba(71,180,198,.45)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1 id="ttl">Plan</h1>
  <div class="sub" id="sub"></div>
</header>
<main id="view"></main>
<div id="timerslot"></div>
<nav id="nav"></nav>
<div id="sheet"></div>
<script>
/* =========================================================================
   PLAN — góra/dół, 4 × w tygodniu, ~35-40 minut na sesję.
   Zasada organizująca: BLOK = JEDNO STANOWISKO. Nie ma supersetów przez pół
   siłowni; na zmianę chodzi tylko to, co stoi w tym samym miejscu (jeden
   drążek, jedna para hantli, jedna brama, jedna suwnica, jeden stojak).
   Dzięki temu przerwa dla mięśnia zostaje pełna, zegar chodzi krócej,
   a stanowiska nikt nie zajmuje, bo się z niego nie schodzi.
   Czas ścięty przez: bloki na jednym stanowisku, myo-reps na izolacjach
   (15 s to odstęp WEWNĄTRZ serii, nie przerwa między seriami), serie na
   RIR 0-2 zamiast objętości z zapasem, RDL zamiast klasycznego martwego.
   Ciężary startowe (pole w) to Twoje wyniki z poprzedniej apki.
   ========================================================================= */
var PLAN = {
  upperA:{name:"Góra A", short:"Góra", tag:"A", day:"poniedziałek", kind:"upper", focus:"klatka skos · plecy · bark · triceps",
    st:[
      {k:"S1", n:"Ławka skośna ze sztangą", place:"ławka skośna", mode:"solo",
        d:"Zajmujesz ławkę i nie oddajesz jej do końca bloku. Rozbiegówki i serie robocze z jednego gryfu."},
      {k:"S2", n:"Drążek i podłoga pod nim", place:"drążek", mode:"alt",
        d:"Podciągasz się, schodzisz, robisz brzuch NA PODŁODZE pod drążkiem, wracasz. Brzuch leży, a nie wisi, bo wznosy w zwisie zjadałyby chwyt przed kolejną serią podciągania z ciężarem."},
      {k:"S3", n:"Maszyna do wyciskania barków", place:"maszyna barkowa", mode:"solo",
        d:"Siadasz, ustawiasz siedzisko i wyciskasz. Żadnej stabilizacji, żadnego balansowania — cały wysiłek idzie w bark, nie w trzymanie się w pionie."},
      {k:"S4", n:"Hantle i ławka — wiosłowanie", place:"hantle", mode:"solo",
        d:"Ręka oparta o stojak, maszynę albo brzeg ławki skośnej — płaska ławka nie jest do niczego potrzebna. Zwykłe serie robocze z pełną przerwą, obie strony w jednej serii."},
      {k:"S6", n:"Wyciąg — triceps (albo mata)", place:"wyciąg", mode:"myo",
        d:"Ostatnie dwie i pół minuty, po drodze do wyjścia. Prosty drążek na wyciągu — albo pompki diamentowe na macie, jeśli nie chcesz nadkładać drogi (zamiennik na rewersie)."},
      {k:"S5", n:"Hantle — blok myo-reps", place:"hantle", mode:"myo",
        d:"To samo miejsce, nie ruszasz się. Trzy bloki po dwie i pół minuty: seria do upadku, 15 s, trzy dobitki po 3-5 powtórzeń. Te 15 s to odstęp w środku serii, nie przerwa między seriami."}
    ], ex:[
    {id:"inc_bench", n:"Wyciskanie skos (sztanga)", g:"S1", q:1, s:3, inc:2.5, r:"6-8", rir:"1", rest:150, w:50, m:["klatka"], sec:["triceps","bark przód"],
      why:"Twój wynik z logu: 60 kg × 3. Na 6-8 powtórzeń z RIR 1 wychodzi ~50 kg. Jedyne ćwiczenie dnia z pełną przerwą, bo tu powstaje największy kawałek bodźca.",
      cue:"Łopatki ściągnięte, sztanga schodzi do dołu klatki, łokcie ~45° od tułowia."},
    {id:"pullup", n:"Podciąganie nachwytem (+ ciężar)", g:"S2", q:1, s:3, inc:2.5, r:"6-8", rir:"1", rest:45, w:12, plus:1, m:["plecy"], sec:["biceps"],
      why:"Z logu: +15 kg × 7. Przy trzech seriach utrzymasz +12 kg. Na zmianę z brzuchem, bo brzuch leży na podłodze pod drążkiem i nie zabiera nic chwytowi.",
      cue:"Bez bujania, klatka do drążka, na dole pełny zwis."},
    {id:"leg_raise", n:"Wznosy nóg leżąc", g:"S2", q:1, s:3, r:"10-20", rir:"1", rest:45, w:0, bw:1, m:["brzuch"],
      why:"Leżysz na podłodze pod drążkiem, ręce pod pośladkami, nogi idą w górę i miednica podwija się do żeber. Prosto, zero sprzętu, zero chwytu — dlatego mieści się w przerwie między seriami podciągania. Progresja wariantem: nogi ugięte → proste → hantel między stopami.",
      cue:"Krzyż dociśnięty do podłogi przez cały ruch. W dole nie odkładasz nóg, zatrzymujesz je tuż nad ziemią."},
    {id:"ohp_mach", n:"Wyciskanie nad głowę na maszynie", g:"S3", s:3, inc:5, r:"8-12", rir:"0-1", rest:105, w:35, test:1, m:["bark przód"], sec:["triceps"],
      why:"Weszło zamiast wyciskania hantli stojąc — i słusznie, bo stojąc limituje Cię stabilizacja tułowia, a nie bark. Na maszynie siedzisz w oparciu, więc możesz iść na RIR 0-1 i faktycznie zmęczyć mięsień, a nie równowagę. Start 35 kg to szacunek (~2 × 18 kg w hantlach), tydzień 1 to kalibracja. Nie ma maszyny? Masz zamiennik na rewersie kafelka.",
      cue:"Plecy dociśnięte do oparcia, żeber nie wypychasz, uchwyty schodzą do linii brody. Nie blokujesz łokci w górze."},
    {id:"row_db", n:"Wiosłowanie hantlem", g:"S4", s:3, inc:2, r:"10-12", rir:"1", rest:105, w:18, each:1, m:["plecy"], sec:["biceps"],
      why:"Rękę opierasz o cokolwiek stabilnego na wysokości bioder: stojak, maszynę, brzeg ławki skośnej. Z logu: 21 kg × 10 jako ostatnia seria piramidy, więc 18 kg na wszystkie trzy. Robisz obie strony w jednej serii, dlatego zajmuje więcej czasu niż zwykłe ćwiczenie — apka ma to już policzone.",
      cue:"Hantel ciągniesz do biodra, łopatka pracuje, tułów nie rotuje."},
    {id:"lat_raise", n:"Wznosy bokiem", g:"S5", q:1, myo:1, s:4, inc:2, r:"12-15", rir:"0", rest:15, w:6, m:["bark bok"],
      why:"Z logu: 9 kg × 8. Sześć kilo na wyższy zakres. Myo-reps: w dwie minuty dostajesz tyle, co wcześniej z czterech osobnych serii.",
      cue:"Prowadzisz łokciem, nie dłonią. Bez zamachu z bioder."},
    {id:"curl_twist", n:"Uginanie z obrotem (Zottman)", g:"S5", q:1, myo:1, s:4, inc:2, r:"10-12", rir:"0-1", rest:15, w:10, m:["biceps","przedramię"],
      why:"Twój sposób: w górę podchwytem normalnie, w górze obracasz nadgarstki, w dół młotkowo albo nachwytem, na dole obrót z powrotem. To stary wariant zwany uginaniem Zottmana — faza w górę robi biceps, faza w dół w obróconym chwycie dokłada ramienno-promieniowy i prostowniki przedramienia. Stoi w środku bloku, żeby rozdzielić dwa ćwiczenia na bark.",
      cue:"Obrót robisz w górze i na dole, nigdy w trakcie ruchu. W dół wolniej niż w górę, bo tam pracuje przedramię."},
    {id:"tri_cable", n:"Prostowanie tricepsu na wyciągu", g:"S6", myo:1, s:4, inc:2.5, r:"10-15", rir:"0", rest:15, w:20, m:["triceps"],
      why:"Z logu: 25 kg × 8 → 20 kg na 10-15. Triceps to dwie trzecie obwodu ramienia, więc dostaje bezpośrednią robotę, a nie tylko odpadki z wyciskań. W poniedziałek, bo czwartek ma już dwa ciężkie wyciskania i dipy.",

/* ---------- STORAGE ---------- */
var KEY = "plan.v1";
var hasWS = (typeof window.storage === "object" && window.storage && typeof window.storage.get === "function");
var DEF = {tab:"plan", active:null, timer:null, weights:{}, fails:{}, sessions:[], stretch:{}, ui:{}, deloadWeek:0, lastDeload:null};
var S = JSON.parse(JSON.stringify(DEF));
var saveT = null, lastFlush = 0;
function flush(){
  clearTimeout(saveT); saveT = null; lastFlush = Date.now();
  var v = JSON.stringify(S);
  try{
    if(hasWS){ var pr = window.storage.set(KEY, v, false); if(pr && pr.catch) pr.catch(function(){}); }
    else { localStorage.setItem(KEY, v); }
  }catch(e){ console.warn("zapis nieudany", e); }
}
function save(){
  if(Date.now() - lastFlush > 1200){ flush(); return; }
  if(saveT) return;
  saveT = setTimeout(flush, 350);
}
window.addEventListener("pagehide", flush);
window.addEventListener("beforeunload", flush);
document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "hidden") flush(); });
function load(){
  return new Promise(function(res){
    if(hasWS){ window.storage.get(KEY).then(function(r){ res(r && r.value ? r.value : null); }).catch(function(){ res(null); }); }
    else { try{ res(localStorage.getItem(KEY)); }catch(e){ res(null); } }
  }).then(function(raw){
    if(!raw) return;
    try{
      var o = JSON.parse(raw);
      Object.keys(DEF).forEach(function(k){ if(o[k] !== undefined && o[k] !== null) S[k] = o[k]; });
    }catch(e){ console.warn("odczyt nieudany", e); }
  });
}

function iso(d){ d = d || new Date(); var z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }

function daysAgo(n){ var d = new Date(); d.setDate(d.getDate()-n); return iso(d); }

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }

function e1rm(w,r){ return w * (1 + r/30); }
function mmss(s){ s = Math.max(0, Math.round(s)); var m = Math.floor(s/60); var x = s%60; return m + ":" + (x<10?"0":"") + x; }
function fmtMin(m){ return m < 60 ? m + " min" : Math.floor(m/60) + " h " + (m%60) + " min"; }
function fmtRest(sec){
  sec = Math.round(sec);
  if(sec < 90) return sec + " s";
  var m = Math.floor(sec/60), r = sec % 60;
  return m + " min" + (r ? " " + r + " s" : "");
}
function ico(p){ return '<svg viewBox="0 0 24 24">' + p + '</svg>'; }
function toast(msg){
  var d = document.createElement("div"); d.className = "toast"; d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, 2200);
}

/* ---------- DANE POCHODNE ---------- */
function exList(dayKey, quick){
  var ex = PLAN[dayKey].ex;
  return quick ? ex.filter(function(e){ return e.q; }) : ex.slice();
}
function setsOf(e){ return S.deloadWeek ? Math.max(1, Math.round(e.s/2)) : e.s; }
function setSec(e){ return e.myo ? 22 : (e.each ? 60 : 42); }
function estSec(dayKey, quick){
  var t = quick ? 210 : 300; /* rozgrzewka */
  exList(dayKey, quick).forEach(function(e){
    var n = setsOf(e);
    if(e.myo) t += (setSec(e) + 45) + (n-1) * (12 + restOf(e));
    else if(e.rp && n > 1) t += (n-1) * (setSec(e) + restOf(e)) + (rpGap() + 25);
    else t += n * (setSec(e) + restOf(e));
    t += 25; /* przejście między ćwiczeniami */
  });
  return t;
}
function estMin(dayKey, quick){ return Math.round(estSec(dayKey, quick)/60); }
/* twarde serie na partię w tygodniu; blok myo liczymy jak 3 zwykłe serie,
   partie pomocnicze po pół serii */
var MUSCLE_ORDER = ["klatka","plecy","bark bok","bark przód","bark tył","biceps","triceps","przedramię","brzuch","czworogłowe","dwugłowe","pośladek","łydki"];
function weekVolume(quick){
  var v = {};
  function add(mus, n){ v[mus] = (v[mus] || 0) + n; }
  weekDays().forEach(function(k){
    exList(k, quick).forEach(function(e){
      var eff = e.myo ? 3 : e.s;
      (e.m || []).forEach(function(mm){ add(mm, eff); });
      (e.sec || []).forEach(function(mm){ add(mm, eff/2); });
    });
  });
  return MUSCLE_ORDER.filter(function(mm){ return v[mm]; }).map(function(mm){ return {m:mm, n:v[mm]}; });
}
/* najlepszy szacowany maks w ćwiczeniu z historii (pomijając wskazaną sesję) */
function bestE1rm(exId, beforeId){
  var best = 0;
  S.sessions.forEach(function(ss){
    if(beforeId && ss.id === beforeId) return;
    var arr = ss.sets && ss.sets[exId];
    if(!arr) return;
    arr.forEach(function(x){ if(x.done){ var v = e1rm(nOr(x.w,0), nOr(x.r,0)); if(v > best) best = v; } });
  });
  return best;
}
function lastSetsFor(exId, beforeId){
  for(var i = S.sessions.length-1; i >= 0; i--){
    var s = S.sessions[i];
    if(beforeId && s.id === beforeId) continue;
    if(s.sets && s.sets[exId] && s.sets[exId].length) return s.sets[exId];
  }
  return null;
}
function lastSessionOf(dayKey){
  for(var i = S.sessions.length-1; i >= 0; i--){ if(S.sessions[i].day === dayKey) return S.sessions[i]; }
  return null;
}
function did(x){ return !!(x.done || x.fail); }
function tonnage(sess){
  var t = 0;
  Object.keys(sess.sets || {}).forEach(function(k){
    sess.sets[k].forEach(function(x){ if(did(x)) t += (nOr(x.w,0) * nOr(x.r,0)); });
  });
  return Math.round(t);
}
function doneSets(sess){
  var n = 0;
  Object.keys(sess.sets || {}).forEach(function(k){ sess.sets[k].forEach(function(x){ if(did(x)) n++; }); });
  return n;
}
function plannedSets(sess){
  var n = 0;
  Object.keys(sess.sets || {}).forEach(function(k){ n += sess.sets[k].length; });
  return n;
}
/* następny dzień w rotacji */
function nextDay(){
  var last = S.sessions.length ? S.sessions[S.sessions.length-1].day : null;
  if(!last) return "upperA";
  var i = DAYKEYS.indexOf(last);
  return DAYKEYS[(i+1) % DAYKEYS.length];
}

/* ---------- PROGRESJA ---------- */
function curWeight(e){
  var v = V(e), w = S.weights[wKey(e)];
  return (w === undefined || w === null || w === "") ? v.w : nOr(w, v.w);
}
/* najmniejszy realny skok obciążenia dla tego sprzętu: hantle co 2 kg,
   sztanga i stos co 2,5 kg, maszyny na nogi co 5 kg */
function stepFor(e){
  var v = V(e);
  if(v.bw) return 0;
  if(v.inc) return v.inc;
  return PLAN[e.day] && PLAN[e.day].kind === "upper" ? 2.5 : 5;
}
function roundStep(v, st){ return Math.max(st, Math.round(v/st)*st); }
/* ocena ćwiczenia po treningu: co zrobić z ciężarem.
   W myo-reps liczy się seria aktywacyjna (pierwsza), dobitki są tylko objętością. */
function judge(e0, arr){
  var e = V(e0);
  var scope = e.myo ? arr.slice(0,1) : (e.rp ? arr.slice(0, Math.max(1, arr.length-1)) : arr);
  var perf = scope.filter(did);
  if(!perf.length) return null;
  if(S.deloadWeek) return null;
  if(e.bw){
    var allTopBW = perf.length === scope.length && scope.every(function(x){ return !x.fail; }) &&
      perf.every(function(x){ return nOr(x.r,0) >= topReps(e.r); });
    return {id:e.id, key:wKey(e0), n:e.n, from:0, to:0, dir:"bw", reset:true,
      why: allTopBW ? "Górny zakres trafiony. Następnym razem trudniejszy wariant, nie więcej powtórzeń." : "Zostajesz na tym wariancie, dokładasz powtórzenia."};
  }
  var cur = curWeight(e);
  var st = stepFor(e);
  var fails = scope.filter(function(x){ return x.fail; }).length;
  var allSets = perf.length === scope.length;
  var allTop = allSets && fails === 0 && perf.every(function(x){ return nOr(x.r,0) >= topReps(e.r); });
  var streak = S.fails[e.id] || 0;
  if(allTop) return {id:e.id, key:wKey(e0), n:e.n, from:cur, to:cur + st, dir:"up", reset:true,
    why: e.myo ? "seria aktywacyjna w górnym zakresie" : "górny zakres we wszystkich seriach"};
  if(fails >= 2 || (fails >= 1 && streak >= 1)){
    return {id:e.id, key:wKey(e0), n:e.n, from:cur, to:roundStep(cur*0.9, st), dir:"down", reset:true,
      why: fails >= 2 ? fails + " nieudane serie, zjeżdżamy o 10%" : "drugi trening z nieudaną serią, zjeżdżamy o 10%"};
  }
  if(fails === 1) return {id:e.id, key:wKey(e0), n:e.n, from:cur, to:cur, dir:"hold", bump:true, why:"jedna nieudana seria, ciężar zostaje"};
  return {id:e.id, key:wKey(e0), n:e.n, from:cur, to:cur, dir:"hold", reset:true, why:"zakres trafiony, jeszcze nie górna granica"};
}

/* ---------- DELOAD ---------- */
function deloadInfo(){
  var mark = S.lastDeload || (S.sessions.length ? S.sessions[0].date : null);
  if(!mark) return {due:false, since:0, hard:0};
  var since = Math.floor((new Date(today()) - new Date(mark)) / 86400000 / 7);
  var hard = S.sessions.filter(function(s){ return s.date > mark && !s.deload; }).length;
  return {due: since >= 8 && hard >= 20, since:since, hard:hard};
}

/* ---------- WYKRES ---------- */
function spark(vals, color, labels){
  if(!vals.length) return '<div class="empty">Za mało danych na wykres.</div>';
  if(vals.length === 1) vals = [vals[0], vals[0]];
  var w = 300, h = 130, pad = 10;
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if(mx - mn < 0.001){ mx = mn + 1; mn = mn - 1; }
  var span = mx - mn;
  var pts = vals.map(function(v,i){
    return [pad + i*(w-2*pad)/(vals.length-1), pad + (1 - (v-mn)/span) * (h-2*pad)];
  });
  var line = pts.map(function(p){ return r1(p[0]) + "," + r1(p[1]); }).join(" ");
  var area = "M" + pad + "," + (h-pad) + " L" + pts.map(function(p){ return r1(p[0])+","+r1(p[1]); }).join(" L") + " L" + (w-pad) + "," + (h-pad) + " Z";
  var dots = pts.map(function(p){ return '<circle cx="'+r1(p[0])+'" cy="'+r1(p[1])+'" r="2.6" fill="'+color+'"/>'; }).join("");
  var lab = labels ? '<text x="'+pad+'" y="'+(h-1)+'" font-size="9" fill="#8A94A0">'+esc(labels[0])+'</text>' +
    '<text x="'+(w-pad)+'" y="'+(h-1)+'" font-size="9" fill="#8A94A0" text-anchor="end">'+esc(labels[1])+'</text>' : "";
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">' +
    '<path d="'+area+'" fill="'+color+'" opacity=".12"/>' +
    '<polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + lab + '</svg>' +
    '<div class="row s12 mut"><span>min ' + r1(mn) + '</span><span>max ' + r1(mx) + '</span></div>';
}

/* ---------- SESJA ---------- */
/* ile dni od ostatniego razu i czy to już czas: ta sama sesja optymalnie co 7 dni,
   minimum 3 dni odstępu, po 10 dniach robi się zaległa */
function dayStatus(last){
  if(!last) return '<div class="exmeta">jeszcze nie robiony</div>';
  var d = daysBetween(last.date, today());
  var col, txt;
  if(d <= 0){ col = "var(--ok)"; txt = "zrobiony dzisiaj"; }
  else if(d < 3){ col = "var(--mut)"; txt = d + (d === 1 ? " dzień temu · jeszcze świeże" : " dni temu · jeszcze świeże"); }
  else if(d <= 9){ col = "var(--ok)"; txt = d + " dni temu · gotowy"; }
  else { col = "var(--bad)"; txt = d + " dni temu · zaległe"; }
  return '<div class="exmeta" style="color:'+col+'">'+txt+(last.dur ? ' <span class="mut">· ostatnio '+last.dur+' min</span>' : '')+'</div>';
}
function dayCard(k, q){
  var d = PLAN[k];
  var list = exList(k, q);
  var sets = list.reduce(function(a,e){ return a + setsOf(e); }, 0);
  var last = lastSessionOf(k);
  return '<div class="card tap daycard'+(d.opt?" opt":"")+'" data-act="startday" data-k="'+k+'">' +
    '<div class="daytag"><b>'+esc(d.short)+'</b><span>'+esc(d.tag)+'</span></div>' +
    '<div style="flex:1;min-width:0">' +
      '<div class="exname">'+esc(d.name)+' <span class="mut s13">· '+esc(d.day)+'</span>'+(d.opt?' <span class="pill">dodatkowy</span>':'')+'</div>' +
      '<div class="exmeta">'+esc(d.focus)+'</div>' +
      '<div class="exmeta">'+list.length+' ćwiczeń · '+sets+' serii · ok. '+estMin(k, q)+' min</div>' +
      '<div class="exmeta" style="color:var(--iron)">'+places(k, q).length+' stanowiska: '+esc(places(k, q).join(" → "))+'</div>' +
      dayStatus(last) +
    '</div>' +
    ico('<path d="M9 5l7 7-7 7"/>').replace('<svg','<svg style="width:18px;height:18px;stroke:#8A94A0;fill:none;stroke-width:2"') +
  '</div>';
}
function ensureActive(k){
  var q = !!S.ui.quick;
  var sets = {}, order = [];
  exList(k, q).forEach(function(e){
    var arr = [], n = setsOf(e);
    for(var i = 0; i < n; i++) arr.push({w: curWeight(e), r: "", done:false, fail:false});
    sets[e.id] = arr; order.push(e.id);
  });
  S.active = {id: Date.now(), day: k, date: today(), sets: sets, order: order, quick: q ? 1 : 0,
    note: "", start: Date.now(), warm: {}, deload: S.deloadWeek ? 1 : 0};
}
function budgetFor(a){ return estMin(a.day, !!a.quick); }
function fold(id, title, sub, inner, openDefault){
  var open = S.ui.fold && S.ui.fold[id] !== undefined ? S.ui.fold[id] : !!openDefault;
  return '<div class="card fold'+(open?" open":"")+'">' +
    '<div class="foldhead tap" data-act="fold" data-k="'+id+'">' +
      '<div style="min-width:0"><div class="exname">'+esc(title)+'</div>' +
      (sub ? '<div class="exmeta">'+esc(sub)+'</div>' : '') + '</div>' +
      '<span class="chev">'+ico('<path d="M6 9l6 6 6-6"/>')+'</span></div>' +

function setLabel(e, i, n){
  n = n || setsOf(e);
  if(e.myo) return i === 0 ? '<b>1</b>aktyw.' : '<b>'+(i+1)+'</b>dobitka';
  if(e.rp && n > 1 && i === n - 1) return '<b>'+(i+1)+'</b>dobitka';
  return '<b>'+(i+1)+'</b>';
}
function setTarget(e, i, n){
  n = n || setsOf(e);
  if(e.myo) return i === 0 ? e.r : "3-5";
  if(e.rp && n > 1 && i === n - 1) return "3-6";
  return e.r;
}
/* Faktyczna przerwa. Tryb spokojny dokłada 30 s do zwykłych przerw
   i 5 s do odstępu w myo-reps. */
function slowOn(){ return !!(S.ui && S.ui.slow); }
function restOf(e){ return e.myo ? (slowOn() ? 20 : 15) : e.rest + (slowOn() ? 30 : 0); }
/* w rest-pause przed dobitką odkładasz ciężar tylko na 20 s */
function rpGap(){ return slowOn() ? 25 : 20; }
function restFor(e, i, n){
  n = n || setsOf(e);
  if(e.rp && n > 1 && i === n - 2) return rpGap();
  return restOf(e);
}
/* ile czasu mija, zanim wrócisz do TEGO ćwiczenia (przy parze liczy się cały cykl) */
function cycleSec(e, dayKey, quick){
  if(e.myo || stInfo(dayKey, e.g).mode !== "alt") return setSec(e) + restOf(e);
  var same = exList(dayKey, quick).filter(function(x){ return x.g === e.g && !x.myo; });
  if(same.length < 2) return setSec(e) + restOf(e);
  return same.reduce(function(a,x){ return a + setSec(x) + restOf(x); }, 0);
}
function altCard(e){
  var on = subOn(e), A = e.alt;
  var w = A.bw ? "masa ciała" : r1(S.weights[e.id+"@alt"] !== undefined ? nOr(S.weights[e.id+"@alt"], A.w) : A.w) + " kg";
  return '<div class="card back" data-exid="'+e.id+'">' +
    '<div class="exhead"><div style="min-width:0">' +
      '<div class="exmeta">zamiast: '+esc(e.n)+'</div>' +
      '<div class="exname" style="margin-top:3px">'+esc(A.n)+'</div></div>' +
      '<button class="btn sm ghost" data-act="flip" data-id="'+e.id+'" aria-label="wróć">'+ico('<path d="M20 8H7l3-3M4 16h13l-3 3"/>')+'</button></div>' +
    '<div class="s13 mut" style="line-height:1.6;margin-top:4px">'+esc(A.why)+'</div>' +
    '<div class="hint"><b>Technika:</b> '+esc(A.cue)+'</div>' +
    '<div class="hint">Start '+w+' · własny slot ciężaru, więc progresja wariantu podstawowego zostaje nietknięta.</div>' +
    '<button class="btn wide '+(on?"":"aqua")+'" data-act="usealt" data-id="'+e.id+'" style="margin-top:12px">' +
      (on ? "Wróć do: " + esc(e.n) : "Przełącz na zamiennik") + '</button></div>';
}
function vSession(){
  var a = S.active, d = PLAN[a.day];
  var budget = budgetFor(a);
  var mins = a.start ? Math.floor((Date.now() - a.start)/60000) : 0;
  var list = exList(a.day, !!a.quick).filter(function(e){ return a.sets[e.id]; });
  var total = list.reduce(function(x,e){ return x + a.sets[e.id].length; }, 0);

  var h = '<div class="row" style="margin-bottom:14px"><div style="min-width:0"><div class="big">'+esc(d.name)+'</div>' +
    '<div class="mut s13">'+doneSets(a)+' / '+total+' serii'+(a.quick?' · tryb 25 min':'')+(a.deload?' · deload':'')+'</div></div>' +
    '<button class="btn sm ghost" data-act="cancel">Przerwij</button></div>';

  h += '<div class="clock'+(mins > budget ? " over" : "")+'"><span id="sesst">'+fmtMin(mins)+'</span>' +
    '<span class="mut s13">z ' + budget + ' min</span></div>';

  h += '<div class="card"><div class="exname">Trasa na dziś</div>' +
    '<div class="exmeta" style="line-height:1.55;margin-top:4px">'+esc(places(a.day, !!a.quick).join("  →  "))+'</div>' +
    '<div class="hint">Tyle razy zmieniasz miejsce. W bloku zostajesz przy swoim sprzęcie do końca — nie oddajesz stanowiska i nie szukasz go potem drugi raz.</div></div>';

  h += fold("warm_"+d.kind, "Rozgrzewka", "5 minut, tylko pod pierwszy bój", warmBlock(d.kind), true);

  var openG = null;
  list.forEach(function(e){
    var gk = e.g || null;
    if(gk !== openG){
      if(openG) h += '</div>';
      openG = gk;
      if(openG){
        var inf = stInfo(a.day, openG);
        var partners = list.filter(function(x){ return x.g === openG; }).map(function(x){ return V(x).n; });
        var cls = inf.mode === "myo" ? " myo" : (inf.mode === "alt" ? "" : " plain");
        h += '<div class="grp'+cls+'"><div class="grphead"><b>'+esc(inf.n)+'</b>' +
          '<span class="mode">'+esc(MODELAB[inf.mode] || "")+'</span>' +
          '<span>'+esc(inf.d)+'</span>' +
          (partners.length > 1 ? '<span>Kolejność: '+esc(partners.join(" → "))+'</span>' : '') + '</div>';
      }
    }
    var arr = a.sets[e.id];
    var prev = lastSetsFor(e.id, a.id);
    var vv = V(e);
    if(e.alt && S.ui.flip && S.ui.flip[e.id]){ h += altCard(e); return; }
    h += '<div class="card" data-exid="'+e.id+'">';
    h += '<div class="exhead"><div style="min-width:0"><div class="exname">'+esc(vv.n)+(vv.isAlt?' <span class="pill myo">zamiennik</span>':'')+'</div>' +
      '<div class="exmeta">'+(e.myo ? "myo-reps · 1 + 3" : (e.rp && arr.length > 1 ? (arr.length-1) + " × " + esc(e.r) + " + dobitka" : arr.length + " × " + esc(e.r))) +
      ' · RIR '+esc(e.rir)+(vv.each?" · na stronę":"")+'</div>' +
      '<div class="exmeta">'+(e.myo
        ? "odstęp na dobitkę " + fmtRest(restOf(e))
        : e.rp
        ? "przerwa " + fmtRest(restOf(e)) + " · przed dobitką tylko " + rpGap() + " s"
        : "przerwa " + fmtRest(restOf(e)) + (stInfo(a.day, e.g).mode === "alt"
            ? " · wracasz tu co ~" + fmtRest(Math.round(cycleSec(e, a.day, !!a.quick)/5)*5)
            : ""))+'</div></div>' +
      '<div style="display:flex;gap:6px;flex:0 0 auto">' +
      (e.alt ? '<button class="btn sm ghost" data-act="flip" data-id="'+e.id+'" aria-label="zamiennik">'+ico('<path d="M4 8h13l-3-3M20 16H7l3 3"/>')+'</button>' : '') +
      '<button class="btn sm ghost" data-act="why" data-id="'+e.id+'" aria-label="dlaczego ten ciężar">?</button></div></div>';
    arr.forEach(function(x,i){
      var cls = x.fail ? " fail" : (x.done ? " done" : "");
      var icon = x.fail ? '<path d="M6 6l12 12M18 6L6 18"/>' : '<path d="M4 12l5 5L20 6"/>';
      h += '<div class="setrow'+cls+'">' +
        '<div class="n">'+setLabel(e,i,arr.length)+'</div>' +
        '<input inputmode="decimal" placeholder="'+(vv.bw ? "bw" : (vv.plus ? "+kg" : "kg"))+'" value="'+esc(x.w)+'" data-f="w" data-ex="'+e.id+'" data-i="'+i+'" pattern="[0-9.,]*" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done">' +
        '<input inputmode="numeric" placeholder="'+esc(setTarget(e,i,arr.length))+'" value="'+esc(x.r)+'" data-f="r" data-ex="'+e.id+'" data-i="'+i+'" pattern="[0-9.,]*" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done">' +
        '<button class="check" data-act="doneset" data-ex="'+e.id+'" data-i="'+i+'" aria-label="zalicz albo oznacz nieudaną">'+ico(icon)+'</button>' +
      '</div>';
    });
    var hint = "";
    var j = judge(e, arr);
    if(j && j.dir === "bw") hint = esc(j.why);
    else if(j && j.dir === "up") hint = '<span class="up">Następnym razem ' + r1(j.to) + ' kg zamiast ' + r1(j.from) + '.</span>';
    else if(j && j.dir === "down") hint = '<span class="down">Następnym razem ' + r1(j.to) + ' kg zamiast ' + r1(j.from) + '.</span> ' + esc(j.why);
    else if(j) hint = "Ciężar zostaje: " + r1(j.to) + " kg — " + esc(j.why) + ".";
    else if(prev) hint = "Poprzednio: " + prev.filter(did).map(function(x){ return (x.w||"?") + "×" + (x.r||"?"); }).join(", ");
    else if(e.test) hint = "Pierwszy raz: dobierz ciężar tak, żeby ostatnie powtórzenie było ciężkie, i zapisz.";
    if(!j) hint += (hint ? " · " : "") + "kwadrat raz = zaliczona, drugi raz = nieudana";
    if(vv.each) hint += " · ciężar na jedną stronę";
    h += '<div class="hint">' + hint + '</div></div>';
  });
  if(openG) h += '</div>';

  if(d.kind === "upper"){
    h += fold("str_upper", "Rozciąganie po treningu", "5 minut, na koniec — mobilność, nie mięśnie",
      tickList(STRETCH_UPPER, "stretch", "s"), false);
  }
  h += '<div class="card"><label class="f">Notatka z treningu</label>' +
    '<textarea rows="2" data-f="note" placeholder="samopoczucie, łokieć, technika...">'+esc(a.note)+'</textarea></div>';
  h += '<button class="btn primary wide" data-act="finish" style="margin-bottom:24px">Zapisz trening</button>';
  return h;
}

/* ---------- WIDOK: PROGRES ---------- */
function vProgres(){
  var h = "";
  var wk = S.sessions.filter(function(s){ return s.date >= daysAgo(6); });
  var srs = wk.reduce(function(a,s){ return a + doneSets(s); }, 0);
  var ton = wk.reduce(function(a,s){ return a + tonnage(s); }, 0);
  var minutes = wk.reduce(function(a,s){ return a + (s.dur || 0); }, 0);
  h += '<div class="card"><div class="row">' +
    '<div><div class="mut s13">Sesje</div><div class="big num">'+wk.length+' / 4</div></div>' +
    '<div><div class="mut s13">Serie</div><div class="big num">'+srs+'</div></div>' +
    '<div><div class="mut s13">Czas</div><div class="big num">'+(minutes ? minutes : "—")+'</div></div>' +
    '<div style="text-align:right"><div class="mut s13">Tonaż</div><div class="big num">'+(ton >= 1000 ? r1(ton/1000) + " t" : ton + " kg")+'</div></div>' +
    '</div><div class="hint">Ostatnie 7 dni. Czas w minutach, liczony od startu sesji do zapisu.</div></div>';

  var s28 = S.sessions.filter(function(s){ return s.date >= daysAgo(27); });
  if(s28.length){
    var avg = Math.round(s28.reduce(function(a,s){ return a + (s.dur || 0); }, 0) / s28.filter(function(s){ return s.dur; }).length || 0);
    h += '<div class="card"><div class="row"><div><div class="mut s13">Średnia długość sesji, 4 tygodnie</div>' +
      '<div class="big num">'+(avg ? avg + " min" : "—")+'</div></div>' +
      '<div class="mut s13" style="max-width:50%;text-align:right">Cel to 35-45 min. Jak regularnie wychodzi dużo ponad 55, włącz tryb krótki — przerw na bojach nie skracaj.</div></div></div>';
  }

  h += '<h2>Progres w ćwiczeniu</h2>';
  var exIds = Object.keys(EXBYID).filter(function(id){ return !!lastSetsFor(id); });
  if(!exIds.length){
    h += '<div class="card"><div class="empty">Wykres pojawi się po pierwszym zapisanym treningu.</div></div>';
  } else {
    var sel = S.ui.chartEx && exIds.indexOf(S.ui.chartEx) >= 0 ? S.ui.chartEx : exIds[0];
    h += '<div class="card"><select data-act="chartex">' + exIds.map(function(id){
      return '<option value="'+id+'"'+(id===sel?" selected":"")+'>'+esc(EXBYID[id].n)+'</option>';
    }).join("") + '</select>';
    var pts = [], labs = [];
    S.sessions.forEach(function(s){
      var arr = s.sets && s.sets[sel];
      if(!arr) return;
      var best = 0;
      arr.forEach(function(x){ if(x.done){ var v = e1rm(nOr(x.w,0), nOr(x.r,0)); if(v > best) best = v; } });
      if(best > 0){ pts.push(r1(best)); labs.push(plDate(s.date)); }
    });
    h += '<div style="margin-top:12px">' + spark(pts, "#FFB020", pts.length ? [labs[0], labs[labs.length-1]] : null) + '</div>' +
      '<div class="hint">Szacowany ciężar maksymalny (wzór Epleya) z najlepszej serii danego dnia. Rośnie = bodziec działa.</div></div>';
  }

  h += '<h2>Historia</h2>';
  if(!S.sessions.length){
    h += '<div class="card"><div class="empty">Pusto. Wejdź w Plan i zacznij od Góry A.</div></div>';
  } else {
    h += '<div class="card list">';
    S.sessions.slice().reverse().slice(0,15).forEach(function(s,i){
      h += '<div class="it tap" data-act="opensess" data-i="'+(S.sessions.length-1-i)+'"><div style="min-width:0">' +
        '<div class="nm">'+esc(PLAN[s.day] ? PLAN[s.day].name : s.day)+(s.quick?' <span class="pill myo">25 min</span>':'')+(s.deload?' <span class="pill">deload</span>':'')+'</div>' +
        '<div class="dt">'+plDate(s.date)+' · '+doneSets(s)+' serii'+(s.dur?' · '+s.dur+' min':'')+'</div></div>' +
        '<div class="kc">'+tonnage(s)+' kg</div></div>';
    });
    h += '</div>';
  }
  h += '<div style="height:16px"></div>';
  return h;
}

/* ---------- WIDOK: ROK ---------- */
function dayMap(){
  var m = {};
  S.sessions.forEach(function(ss){
    var d = PLAN[ss.day];
    m[ss.date] = d ? (d.opt ? "extra" : d.kind) : "upper";
  });
  Object.keys(S.stretch || {}).forEach(function(dt){ if(!m[dt]) m[dt] = "str"; });
  return m;
}
function vRok(){
  var m = dayMap(), t = today();
  var end = new Date(t + "T12:00:00");
  end.setDate(end.getDate() + (6 - end.getDay() + 7) % 7); /* domknij tydzień do niedzieli */
  var days = [];
  for(var i = 370; i >= 0; i--){
    var dd = new Date(end.getTime()); dd.setDate(dd.getDate() - i);
    days.push(iso(dd));
  }
  var cols = [];
  for(var c = 0; c < days.length; c += 7) cols.push(days.slice(c, c+7));
  var MON = ["sty","lut","mar","kwi","maj","cze","lip","sie","wrz","paź","lis","gru"];
  var labs = cols.map(function(col){
    var first = col[0], dnum = parseInt(first.slice(8), 10);
    return dnum <= 7 ? MON[parseInt(first.slice(5,7),10)-1] : "";
  });
  var h = '<div class="card"><div class="monrow">' + labs.map(function(l){ return '<span>'+l+'</span>'; }).join("") + '</div>' +
    '<div class="cal">' + cols.map(function(col){
      return '<div class="calcol">' + col.map(function(dt){
        var cls = m[dt] ? " on " + m[dt] : "";
        if(dt === t) cls += " today";
        if(dt > t) cls += " future";
        return '<i class="'+cls.trim()+'" data-act="calday" data-d="'+dt+'"></i>';
      }).join("") + '</div>';
    }).join("") + '</div>' +
    '<div class="callegend">' +
      '<span><i class="on upper"></i>góra</span>' +
      '<span><i class="on lower"></i>dół</span>' +
      '<span><i class="on extra"></i>dobitka</span>' +
      '<span><i class="on str"></i>rozciąganie</span>' +
    '</div>' +
    '<div class="hint">Ostatnie 53 tygodnie. Każdy kwadrat to jeden dzień, kolumna to tydzień od poniedziałku. Stuknij kwadrat, żeby zobaczyć co było.</div></div>';

  /* statystyki */
  var ses = S.sessions.length;
  var y = t.slice(0,4);
  var inYear = S.sessions.filter(function(ss){ return ss.date.slice(0,4) === y; }).length;
  var last60 = S.sessions.filter(function(ss){ return ss.date >= daysAgo(55); }).length;
  var perWeek = r1(last60 / 8);
  /* seria tygodni z min. 3 treningami */
  var streak = 0;
  for(var w = 0; w < 60; w++){
    var from = daysAgo(7*w + 6), to = daysAgo(7*w);
    var n = S.sessions.filter(function(ss){ return ss.date >= from && ss.date <= to; }).length;
    if(n >= 3) streak++; else if(w > 0) break; else if(n === 0) break;
  }
  /* najdłuższa przerwa */
  var gap = 0, sorted = S.sessions.map(function(ss){ return ss.date; }).sort();
  for(var g = 1; g < sorted.length; g++){
    var dif = daysBetween(sorted[g-1], sorted[g]);
    if(dif > gap) gap = dif;
  }
  if(sorted.length) { var sinceLast = daysBetween(sorted[sorted.length-1], t); if(sinceLast > gap) gap = sinceLast; }
  h += '<div class="card"><div class="row">' +
    '<div><div class="mut s13">W tym roku</div><div class="big num">'+inYear+'</div></div>' +
    '<div><div class="mut s13">Na tydzień</div><div class="big num">'+(perWeek ? String(perWeek).replace(".", ",") : "—")+'</div></div>' +
    '<div><div class="mut s13">Seria tyg.</div><div class="big num">'+streak+'</div></div>' +
    '<div style="text-align:right"><div class="mut s13">Max przerwa</div><div class="big num">'+gap+' dni</div></div>' +
    '</div><div class="hint">Seria tygodni liczy kolejne tygodnie z minimum trzema treningami. Razem zapisanych sesji: '+ses+'.</div></div>';
  h += '<div style="height:16px"></div>';
  return h;
}

        '<div class="rz">'+(vv.bw ? "masa ciała, progresja wariantem" : (e.myo ? "myo-reps · " : "") + (e.rp && setsOf(e) > 1 ? (setsOf(e)-1) + " × " + esc(e.r) + " + dobitka" : setsOf(e) + " × " + esc(e.r)) + " · RIR " + esc(e.rir) + (changed ? " · start " + vv.w + " kg" : "")) + '</div></div>' +
        (vv.bw ? '<div class="mut s13" style="text-align:right">—</div>' :
        '<div style="display:flex;gap:4px;align-items:center">' +
          '<button class="btn sm ghost" data-act="setw" data-id="'+e.id+'" data-v="'+(-stepFor(e))+'">−</button>' +
          '<input inputmode="decimal" data-wid="'+k+'" value="'+r1(cur)+'" pattern="[0-9.,]*" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done">' +
          '<button class="btn sm ghost" data-act="setw" data-id="'+e.id+'" data-v="'+stepFor(e)+'">+</button>' +
        '</div>') + '</div>';
    });

  });

  h += '<h2>Dane</h2><div class="card">' +
    '<button class="btn wide" data-act="export">Zapisz kopię do pliku</button>' +
    '<div style="height:8px"></div>' +
    '<button class="btn wide ghost" data-act="import">Wczytaj kopię z pliku</button>' +
    '<div class="hint">Plik JSON z historią i ciężarami. Wczytać możesz też kopię ze starej apki — apka weźmie z niej ciężary i historię treningów, resztę pominie.</div></div>';
  h += '<div class="card"><button class="btn wide ghost" data-act="reset" style="color:var(--bad)">Wyczyść wszystko</button>' +
    '<div class="hint">Kasuje historię i wraca do ciężarów startowych. Nie da się cofnąć.</div></div>';
  h += '<div style="height:16px"></div>';
  return h;
}

/* ---------- RENDER ---------- */

setInterval(function(){
  if(!S.active || !S.active.start) return;
  var el = document.getElementById("sesst");
  if(!el) return;
  var m = Math.floor((Date.now() - S.active.start)/60000);

/* ---------- TIMER PRZERWY ---------- */
var tick = null;
function startTimer(sec, label, myo){
  S.timer = {end: Date.now() + sec*1000, total: sec, label: label, myo: myo ? 1 : 0};
  save(); renderTimer();
}
function renderTimer(){
  var slot = document.getElementById("timerslot");
  if(!S.timer){ slot.innerHTML = ""; document.body.classList.remove("hastimer"); if(tick){ clearInterval(tick); tick = null; } return; }
  var left = (S.timer.end - Date.now())/1000;
  if(left <= -60){ S.timer = null; slot.innerHTML = ""; document.body.classList.remove("hastimer"); return; }
  document.body.classList.add("hastimer");
  slot.innerHTML = '<div class="timer'+(S.timer.myo?" myo":"")+'"><div class="t">'+(left>0?mmss(left):"0:00")+'</div>' +
    '<div class="lab">'+(left>0 ? esc(S.timer.label) : "Przerwa skończona, wchodzisz w serię")+'</div>' +
    '<button data-act="addtime">+30 s</button><button data-act="stoptimer">Koniec</button></div>';
  if(!tick){
    tick = setInterval(function(){
      if(!S.timer){ clearInterval(tick); tick = null; return; }
      var l = (S.timer.end - Date.now())/1000;
      var el = document.querySelector(".timer .t");
      if(!el){ renderTimer(); return; }
      el.textContent = l > 0 ? mmss(l) : "0:00";
      if(l <= 0 && !S.timer.beeped){ S.timer.beeped = true; beep(); renderTimer(); }
    }, 500);
  }
}
function beep(){
  try{
    var C = window.AudioContext || window.webkitAudioContext;
    if(C){
      var ctx = new C(), o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.45);
      o.start(); o.stop(ctx.currentTime + 0.5);
    }
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([120,80,120]);
}

/* ---------- ARKUSZE ---------- */
function sheet(html){
  document.getElementById("sheet").innerHTML = '<div class="sheet" data-act="closesheet"><div class="in" data-stop="1">' + html + '</div></div>';
}
function closeSheet(){ document.getElementById("sheet").innerHTML = ""; }
function daysBetween(a0, b0){ return Math.round((new Date(b0) - new Date(a0)) / 86400000); }
function sheetStretch(){
  if(!window._sfull) window._sfull = {};
  var n = STRETCH_FULL.filter(function(_,i){ return window._sfull["f"+i]; }).length;
  sheet('<h3>Rozciąganie całego ciała</h3>' +
    '<div class="mut s13" style="margin-bottom:12px">'+n+' / '+STRETCH_FULL.length+' zrobione · ok. 14 min. Każda pozycja do granicy napięcia, nie do bólu. Oddychasz, nie wstrzymujesz.</div>' +
    tickList(STRETCH_FULL, "sfull", "f") +
    '<button class="btn primary wide" data-act="savestretch" style="margin-top:14px">Zapisz rozciąganie</button>' +
    '<button class="btn wide ghost" data-act="closesheet" style="margin-top:8px">Zamknij</button>');
}
function sheetWhy(e0){
  var e = V(e0);
  sheet('<h3>'+esc(e.n)+(e.isAlt?' <span class="pill myo">zamiennik</span>':'')+'</h3>' +
    '<div class="mut s13" style="margin-bottom:12px">'+(e.myo ? "myo-reps · 1 seria aktywacyjna + 3 dobitki" : e.s + " × " + esc(e.r)) +
      ' · RIR '+esc(e.rir)+' · '+(e.myo ? "odstęp " + fmtRest(restOf(e)) : "przerwa " + fmtRest(restOf(e)))+'</div>' +
    '<div class="mut s13" style="margin-bottom:12px">Partie: '+esc((e.m||[]).join(", "))+(e.sec && e.sec.length ? ' (pomocniczo '+esc(e.sec.join(", "))+')' : '')+'</div>' +
    '<div style="line-height:1.6">'+esc(e.why)+'</div>' +
    (e.cue ? '<div class="hint"><b>Technika:</b> '+esc(e.cue)+'</div>' : '') +
    (e.rp ? '<div class="hint"><b>Jak zrobić dobitkę rest-pause:</b> dwie serie robocze idziesz do momentu, w którym kolejne powtórzenie nie wejdzie o własnych siłach — na maszynie i na wyciągu jest to bezpieczne, nic Cię nie przygniecie. Po drugiej serii odkładasz ciężar na '+rpGap()+' sekund i robisz trzecie podejście tym samym obciążeniem: wejdzie 3-6 powtórzeń. To trzecia seria w jedną trzecią czasu.</div>' : '') +
    (e.myo ? '<div class="hint"><b>Jak zrobić myo-reps:</b> seria aktywacyjna w zakresie '+esc(e.r)+' do momentu, w którym kolejne powtórzenie nie wejdzie. Odstawiasz, liczysz '+restOf(e)+' sekund, robisz 3-5 powtórzeń tym samym ciężarem. Znowu tyle samo i tak trzy razy. Jak w dobitce wchodzi mniej niż 3, kończysz blok.<br><br>Te '+restOf(e)+' s to nie jest przerwa między seriami — to odstęp wewnątrz jednej serii. Mięsień jest już zmęczony po aktywacji, więc kilka powtórzeń po krótkiej pauzie idzie od razu na maksa. Na dużych bojach przerwy są normalne: 1,5-2 min plus czas partnera z pary.</div>' : '') +
    '<div class="hint">Skok przy progresji: '+(e.bw ? "wariant, nie kilogramy" : "+"+r1(stepFor(e))+" kg")+'. Ciężar startowy z logu: '+(e.bw ? "masa ciała" : (e.plus?"+":"")+e.w+' kg')+'. Teraz: '+(e.bw ? "—" : r1(curWeight(e))+' kg')+'.</div>' +
    '<button class="btn wide" data-act="closesheet" style="margin-top:14px">Zamknij</button>');
}
function sheetProgress(chg){
  var bw = chg.filter(function(j){ return j.dir === "bw"; });
  chg = chg.filter(function(j){ return j.dir !== "bw"; });
  var ups = chg.filter(function(j){ return j.dir === "up"; }).length;
  var dns = chg.filter(function(j){ return j.dir === "down"; }).length;
  var top = ups ? (ups + (ups === 1 ? " ciężar w górę" : " ciężary w górę")) : (dns ? dns + " w dół" : "Ciężary bez zmian");
  var prs = window._prs || [];
  var h = '<h3>Ciężary na następny raz</h3>';
  if(prs.length){
    h += '<div class="card" style="border-color:var(--ok);background:rgba(95,208,138,.07);margin-bottom:12px">' +
      '<div class="exname" style="color:var(--ok)">'+(prs.length === 1 ? "Rekord!" : prs.length + " rekordy!")+'</div>' +
      '<div class="s13 mut" style="margin-top:4px">'+prs.map(function(id){ return esc(V(EXBYID[id]).n); }).join(" · ")+'</div>' +
      '<div class="hint">Najlepszy szacowany maks w tych ćwiczeniach w całej Twojej historii. To jest dowód, że plan działa.</div></div>';
  }
  h += '<div class="mut s13" style="margin-bottom:12px">'+esc(top)+'. Możesz poprawić każdą wartość, apka zapamięta Twoją.</div>';
  chg.forEach(function(j){
    var st = stepFor(EXBYID[j.id]) || 2.5;
    var arrow = j.dir === "up" ? '<span class="up">'+r1(j.from)+' → '+r1(j.to)+' kg</span>'
      : j.dir === "down" ? '<span class="down">'+r1(j.from)+' → '+r1(j.to)+' kg</span>'
      : r1(j.to) + " kg";
    h += '<div class="chg"><div style="min-width:0"><div class="nm">'+esc(j.n)+'</div>' +
      '<div class="rz">'+arrow+' · '+esc(j.why)+'</div></div>' +
      '<div style="display:flex;gap:4px;align-items:center">' +
        '<button class="btn sm ghost" data-act="chgw" data-id="'+j.key+'" data-v="'+(-st)+'">−</button>' +
        '<input inputmode="decimal" data-w="'+j.key+'" value="'+r1(j.to)+'" pattern="[0-9.,]*" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done">' +
        '<button class="btn sm ghost" data-act="chgw" data-id="'+j.key+'" data-v="'+st+'">+</button>' +
      '</div></div>';
  });
  if(bw.length){
    h += '<div class="hint">' + bw.map(function(j){
      return '<div style="margin-bottom:4px"><b>'+esc(j.n)+'</b> — '+esc(j.why)+'</div>';
    }).join("") + '</div>';
  }
  h += '<button class="btn primary wide" data-act="saveprog" style="margin-top:14px">Gotowe</button>';
  sheet(h);
}
function sheetSession(i){
  var s = S.sessions[i];
  if(!s) return;
  var h = '<h3>'+esc(PLAN[s.day] ? PLAN[s.day].name : s.day)+'</h3>' +
    '<div class="mut s13" style="margin-bottom:12px">'+plDate(s.date)+' · '+doneSets(s)+' / '+plannedSets(s)+' serii'+(s.dur?' · '+s.dur+' min':'')+' · '+tonnage(s)+' kg tonażu</div>';
  (s.order || Object.keys(s.sets)).forEach(function(id){
    var e = EXBYID[id], arr = s.sets[id];
    if(!e || !arr) return;
    var done = arr.filter(did);
    h += '<div class="kv"><span style="min-width:0">'+((s.prs||[]).indexOf(id) >= 0 ? '<span style="color:var(--ok)">★</span> ' : '')+esc(V(e).n)+'</span><b>' +
      (done.length ? done.map(function(x){ return (x.fail ? "✕" : "") + (x.w || "0") + "×" + (x.r || "0"); }).join("  ") : "—") + '</b></div>';
  });
  if(s.note) h += '<div class="hint"><b>Notatka:</b> '+esc(s.note)+'</div>';
  h += '<button class="btn wide ghost" data-act="delsess" data-i="'+i+'" style="margin-top:14px;color:var(--bad)">Usuń ten trening</button>' +
    '<button class="btn wide" data-act="closesheet" style="margin-top:8px">Zamknij</button>';
  sheet(h);
}

/* ---------- IMPORT / EKSPORT ---------- */
function doExport(){
  var blob = new Blob([JSON.stringify(S, null, 1)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var link = document.createElement("a");
  link.href = url; link.download = "plan-backup-" + today() + ".json";
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
function doImport(){
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.addEventListener("change", function(){
    var f = inp.files && inp.files[0];
    if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      var o;
      try{ o = JSON.parse(String(rd.result)); }catch(e){ toast("To nie jest plik z kopią"); return; }
      var got = [];
      if(o.weights && typeof o.weights === "object"){
        Object.keys(o.weights).forEach(function(k){ if(EXBYID[k]) S.weights[k] = nOr(o.weights[k], EXBYID[k].w); });
        got.push("ciężary");
      }
      if(Array.isArray(o.sessions) && o.sessions.length){
        var have = {};
        S.sessions.forEach(function(s){ have[s.id] = 1; });
        o.sessions.forEach(function(s){
          if(!s || !s.sets || have[s.id]) return;
          S.sessions.push(s);
        });
        S.sessions.sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
        got.push("historia");
      }
      if(o.fails && typeof o.fails === "object") S.fails = Object.assign({}, S.fails, o.fails);
      if(!got.length){ toast("Nic do wczytania w tym pliku"); return; }
      save(); render(); toast("Wczytane: " + got.join(" i "));
    };
    rd.readAsText(f);
  });
  inp.click();
}

/* ---------- ZDARZENIA ---------- */
document.addEventListener("click", function(ev){
  var stop = ev.target.closest("[data-stop]");
  var b = ev.target.closest("[data-act]");
  if(!b) return;
  var a = b.dataset.act;
  if(a === "closesheet" && stop && b.classList.contains("sheet")) return;

  if(a === "tab"){ S.tab = b.dataset.k; save(); render(); window.scrollTo(0,0); return; }
  if(a === "closesheet"){ closeSheet(); return; }

  if(a === "quick"){ S.ui.quick = !S.ui.quick; save(); render(); toast(S.ui.quick ? "Tryb krótki włączony" : "Pełny plan"); return; }
  if(a === "day5"){ S.ui.day5 = !S.ui.day5; save(); render(); toast(S.ui.day5 ? "Piąty trening wliczony do tygodnia" : "Tydzień liczony z czterech sesji"); return; }
  if(a === "slow"){ S.ui.slow = !S.ui.slow; save(); render(); toast(S.ui.slow ? "Przerwy dłuższe o 30 s" : "Przerwy standardowe"); return; }
  if(a === "startday"){
    if(S.active && !confirm("Masz niezapisany trening. Zacząć nowy i porzucić tamten?")) return;
    ensureActive(b.dataset.k); S.tab = "plan"; save(); render(); window.scrollTo(0,0); return;
  }
  if(a === "deloadon"){ S.deloadWeek = 1; S.lastDeload = today(); save(); render(); toast("Tydzień deloadu włączony"); return; }
  if(a === "deloadoff"){ S.deloadWeek = 0; S.lastDeload = today(); save(); render(); toast("Wracamy do pełnej objętości"); return; }
  if(a === "deloadskip"){ S.lastDeload = today(); save(); render(); return; }
  if(a === "fold"){
    if(!S.ui.fold) S.ui.fold = {};
    var fk = b.dataset.k;
    var cur = S.ui.fold[fk] !== undefined ? S.ui.fold[fk] : (fk.indexOf("warm_") === 0);
    S.ui.fold[fk] = !cur; save(); render(); return;
  }
  if(a === "tick"){
    var store = b.dataset.store || "warm";
    if(store === "sfull"){
      if(!window._sfull) window._sfull = {};
      window._sfull[b.dataset.k] = !window._sfull[b.dataset.k];
      sheetStretch(); return;
    }
    if(!S.active) return;
    if(!S.active[store]) S.active[store] = {};
    S.active[store][b.dataset.k] = !S.active[store][b.dataset.k];
    save(); render(); return;
  }
  if(a === "cancel"){
    if(confirm("Przerwać trening bez zapisu?")){ S.active = null; S.timer = null; save(); render(); }
    return;
  }
  if(a === "doneset"){
    if(!S.active) return;
    var ex = b.dataset.ex, i = parseInt(b.dataset.i,10);
    var arr0 = S.active.sets[ex], st = arr0[i], e0 = EXBYID[ex], n0 = arr0.length;
    if(!st.done && !st.fail){
      st.done = true; st.fail = false;
      if(!st.r) st.r = String(botReps(setTarget(e0, i, n0)));
      if(!st.w && !V(e0).bw) st.w = curWeight(e0);
      var rest = restFor(e0, i, n0);
      var isRp = !!(e0.rp && n0 > 1 && i === n0 - 2);
      var vn = V(e0).n;
      var lab = e0.myo ? (i === 0 ? "15 s i pierwsza dobitka · " + vn : "15 s i kolejna dobitka · " + vn)
        : isRp ? (rpGap() + " s i dobitka · " + vn) : "Przerwa · " + vn;
      if(!e0.myo && !isRp && stInfo(S.active.day, e0.g).mode === "alt"){
        var g = e0.g, sameG = exList(S.active.day, !!S.active.quick).filter(function(x){ return x.g === g; });
        if(sameG.length > 1){
          var idx = sameG.indexOf(e0);
          var partner = sameG[(idx+1) % sameG.length];
          lab = "Teraz: " + V(partner).n;
        }
      }
      startTimer(rest, lab, e0.myo || isRp);
    } else if(st.done){
      st.done = false; st.fail = true;
      if(!st.w && !V(e0).bw) st.w = curWeight(e0);
    } else {
      st.fail = false;
    }
    save(); render();
    return;
  }
  if(a === "openstretch"){ window._sfull = {}; sheetStretch(); return; }
  if(a === "savestretch"){
    S.stretch[today()] = "full";
    window._sfull = {};
    save(); closeSheet(); render(); toast("Rozciąganie zapisane");
    return;
  }
  if(a === "why"){ sheetWhy(EXBYID[b.dataset.id]); return; }
  if(a === "flip"){
    var fid = b.dataset.id, fcard = b.closest(".card");
    if(!S.ui.flip) S.ui.flip = {};
    if(fcard) fcard.classList.add("flipout");
    setTimeout(function(){
      S.ui.flip[fid] = !S.ui.flip[fid];
      save(); render();
      var nc = document.querySelector('.card[data-exid="'+fid+'"]');
      if(nc){ nc.classList.add("flipin"); setTimeout(function(){ nc.classList.remove("flipin"); }, 280); }
    }, 150);
    return;
  }
  if(a === "usealt"){
    var uid = b.dataset.id, ue = EXBYID[uid];
    if(!S.ui.sub) S.ui.sub = {};
    S.ui.sub[uid] = !S.ui.sub[uid];
    if(!S.ui.flip) S.ui.flip = {};
    S.ui.flip[uid] = false;
    if(S.active && S.active.sets[uid]){
      S.active.sets[uid].forEach(function(x){ if(!x.done && !x.fail) x.w = curWeight(ue); });
      if(!S.active.subs) S.active.subs = {};
      if(S.ui.sub[uid]) S.active.subs[uid] = 1; else delete S.active.subs[uid];
    }
    save(); render();
    toast(S.ui.sub[uid] ? "Zamiennik włączony" : "Wracasz do podstawowego");
    return;
  }
  if(a === "finish"){
    if(!S.active) return;
    if(!doneSets(S.active)){ toast("Nie odhaczyłeś żadnej serii"); return; }
    var day = PLAN[S.active.day];
    var chg = [];
    day.ex.forEach(function(e){
      var arr = S.active.sets[e.id];
      if(!arr) return;
      var j = judge(e, arr);
      if(!j) return;
      S.fails[e.id] = j.reset ? 0 : (j.bump ? (S.fails[e.id]||0) + 1 : (S.fails[e.id]||0));
      chg.push(j);
    });
    var prs = [];
    day.ex.forEach(function(e){
      var arr = S.active.sets[e.id];
      if(!arr || V(e).bw) return;
      var now = 0;
      arr.forEach(function(x){ if(x.done){ var v = e1rm(nOr(x.w,0), nOr(x.r,0)); if(v > now) now = v; } });
      if(now <= 0) return;
      var was = bestE1rm(e.id, S.active.id);
      if(was > 0 && now > was * 1.005) prs.push(e.id);
    });
    S.active.prs = prs;
    window._prs = prs;
    S.active.changes = chg.map(function(j){ return {id:j.id, from:j.from, to:j.to, dir:j.dir}; });
    if(S.active.start) S.active.dur = Math.round((Date.now() - S.active.start)/60000);
    var sticks = Object.keys(S.active.stretch || {}).filter(function(k){ return S.active.stretch[k]; }).length;
    if(sticks >= 3 && S.stretch[S.active.date] !== "full") S.stretch[S.active.date] = "upper";
    S.sessions.push(S.active);
    S.active = null; S.timer = null;
    chg.forEach(function(j){ if(j.dir !== "bw") S.weights[j.key] = j.to; });
    save(); render(); window.scrollTo(0,0);
    sheetProgress(chg);
    return;
  }
  if(a === "chgw"){
    var id = b.dataset.id, dv = nOr(b.dataset.v,0);
    var inp = document.querySelector('input[data-w="'+id+'"]');
    if(!inp) return;
    inp.value = r1(Math.max(0, nOr(inp.value,0) + dv));
    S.weights[id] = nOr(inp.value,0); save();
    return;
  }
  if(a === "saveprog"){
    document.querySelectorAll("input[data-w]").forEach(function(inp){
      S.weights[inp.dataset.w] = nOr(inp.value, S.weights[inp.dataset.w]);
    });
    save(); closeSheet(); render(); toast("Trening zapisany");
    return;
  }
  if(a === "setw"){
    var wid = b.dataset.id, d2 = nOr(b.dataset.v,0);
    var el2 = document.querySelector('input[data-wid="'+wid+'"]');
    if(!el2) return;
    el2.value = r1(Math.max(0, nOr(el2.value,0) + d2));
    S.weights[wid] = nOr(el2.value,0); save();
    return;
  }
  if(a === "addtime"){ if(S.timer){ S.timer.end += 30000; S.timer.beeped = false; save(); renderTimer(); } return; }
  if(a === "stoptimer"){ S.timer = null; save(); renderTimer(); return; }
  if(a === "calday"){
    var cd = b.dataset.d;
    var idx = -1;
    S.sessions.forEach(function(ss,ii){ if(ss.date === cd) idx = ii; });
    if(idx >= 0){ sheetSession(idx); return; }
    if(S.stretch && S.stretch[cd]){ toast(plDate(cd) + " · rozciąganie " + (S.stretch[cd] === "full" ? "całego ciała" : "po górze")); return; }
    toast(plDate(cd) + " · nic nie zapisane");
    return;
  }
  if(a === "opensess"){ sheetSession(parseInt(b.dataset.i,10)); return; }
  if(a === "delsess"){
    if(!confirm("Usunąć ten trening z historii?")) return;
    S.sessions.splice(parseInt(b.dataset.i,10), 1);
    save(); closeSheet(); render(); return;
  }
  if(a === "export"){ doExport(); return; }
  if(a === "import"){ doImport(); return; }
  if(a === "reset"){
    if(!confirm("Skasować całą historię i wrócić do ciężarów startowych?")) return;
    S.sessions = []; S.weights = {}; S.fails = {}; S.active = null; S.timer = null; S.deloadWeek = 0; S.lastDeload = null;
    save(); render(); toast("Wyczyszczone");
    return;
  }
});
document.addEventListener("change", function(ev){
  var el = ev.target, f = el.dataset.f;
  if(el.dataset.act === "chartex"){ S.ui.chartEx = el.value; save(); render(); return; }
  if(el.dataset.wid !== undefined){ S.weights[el.dataset.wid] = nOr(el.value, curWeight(EXBYID[el.dataset.wid])); save(); return; }
  if(!f) return;
  if(el.dataset.ex !== undefined && S.active){
    var arr = S.active.sets[el.dataset.ex];
    if(!arr) return;
    arr[parseInt(el.dataset.i,10)][f] = el.value;
    save();
    return;
  }
  if(f === "note" && S.active){ S.active.note = el.value; save(); return; }
});

/* ---------- START ---------- */
load().then(function(){
  if(!S.ui) S.ui = {};
  if(S.active && S.active.day && !PLAN[S.active.day]) S.active = null;
  render();
  if("serviceWorker" in navigator && location.protocol === "https:"){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  }
});
